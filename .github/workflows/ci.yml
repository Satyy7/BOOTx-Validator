name: BOOTX CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast lane: unit tests that don't need a built firmware stack (parser,
  # contract engine, memory/DTB/image validators against synthetic or
  # dtc-compiled fixtures). No firmware build required -- runs on every push.
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3-pip python3-venv

      - name: Install BOOTX
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run unit-level test suite
        run: |
          .venv/bin/python -m pytest -m "not (boot or smp or psci or performance)" --junitxml=reports/junit-unit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: reports/junit-unit.xml

  # Slow lane: builds the real TF-A + U-Boot + Linux stack and runs the full
  # end-to-end regression suite (real QEMU boots). Firmware build output is
  # cached by pinned-version + script hash so unchanged pins don't rebuild.
  build-and-regression:
    runs-on: ubuntu-22.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install host tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-arm qemu-utils \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            device-tree-compiler \
            build-essential bc bison flex libssl-dev libelf-dev libgnutls28-dev \
            cpio rsync python3-pip python3-venv unzip

      - name: Install BOOTX
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Cache firmware source checkouts
        uses: actions/cache@v4
        with:
          path: firmware/*/src
          key: bootx-firmware-src-${{ hashFiles('docs/boot-flow.md') }}

      - name: Cache built firmware images
        id: image-cache
        uses: actions/cache@v4
        with:
          path: qemu/images
          key: bootx-firmware-build-${{ hashFiles('docs/boot-flow.md', 'qemu/scripts/*.sh', 'firmware/linux/initramfs/init.c') }}

      - name: Fetch firmware sources
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          [ -d firmware/tf-a/src ]    || git clone --branch v2.15.0  --depth 1 https://github.com/ARM-software/arm-trusted-firmware.git firmware/tf-a/src
          [ -d firmware/u-boot/src ]  || git clone --branch v2026.07 --depth 1 https://github.com/u-boot/u-boot.git firmware/u-boot/src
          [ -d firmware/linux/src ]   || git clone --branch v6.12    --depth 1 https://github.com/torvalds/linux.git firmware/linux/src

      - name: Build firmware stack
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: make build

      - name: Run full regression suite
        run: .venv/bin/python -m pytest -m regression --junitxml=reports/junit.xml
        continue-on-error: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-regression
          path: reports/junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-run-artifacts
          path: reports/runs/
